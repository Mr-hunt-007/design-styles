<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" role="img" aria-labelledby="arch-title arch-desc"
     font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="arch-title">Web platform architecture</title>
  <desc id="arch-desc">Request flow from clients through an edge zone (CDN, WAF, load balancer) into an application zone with three services (auth, API, media), a message queue consumed by a worker pool, and a data zone holding Redis, PostgreSQL and object storage. A monitoring service on the right receives telemetry from all three zones.</desc>

  <defs>
    <marker id="arch-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#76828F"/>
    </marker>
    <marker id="arch-arrd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA6B2"/>
    </marker>

    <!-- 24x24 stroke icons, one weight -->
    <symbol id="arch-ic-users" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8.2" r="3.1"/>
        <path d="M3.6 19c0-3 2.4-4.9 5.4-4.9s5.4 1.9 5.4 4.9"/>
        <path d="M15.4 5.6a3.1 3.1 0 0 1 0 5.2M17.2 14.4c2 .6 3.3 2.3 3.3 4.6"/>
      </g>
    </symbol>
    <symbol id="arch-ic-cloud" viewBox="0 0 24 24">
      <path d="M7 17h9.6a3.5 3.5 0 0 0 .5-7 5.1 5.1 0 0 0-9.9-1.2A3.9 3.9 0 0 0 7 17Z"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="arch-ic-shield" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.4 18.5 5.8v5.2c0 4.5-2.9 7.3-6.5 9.2-3.6-1.9-6.5-4.7-6.5-9.2V5.8Z"/>
        <path d="m9.2 11.6 2.1 2.1 3.8-4"/>
      </g>
    </symbol>
    <symbol id="arch-ic-lb" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="5.4" r="2.3"/>
        <path d="M12 7.7v3.1M12 10.8 5.4 16.6M12 10.8v6.4M12 10.8l6.6 5.8"/>
        <circle cx="4.9" cy="18.3" r="1.6"/>
        <circle cx="12" cy="19.1" r="1.6"/>
        <circle cx="19.1" cy="18.3" r="1.6"/>
      </g>
    </symbol>
    <symbol id="arch-ic-key" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="12" r="3.6"/>
        <path d="M11.6 12h8.6M17.4 12v2.9M20.2 12v2"/>
      </g>
    </symbol>
    <symbol id="arch-ic-api" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8.6 8-4 4 4 4M15.4 8l4 4-4 4M13.3 6.2l-2.6 11.6"/>
      </g>
    </symbol>
    <symbol id="arch-ic-media" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5.5" width="16" height="13" rx="2"/>
        <circle cx="9" cy="10" r="1.5"/>
        <path d="m4.6 16 4.4-3.9 3.4 3.2 2.8-2.6 4.2 3.8"/>
      </g>
    </symbol>
    <symbol id="arch-ic-queue" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="5.4" width="15" height="3.4" rx="1.3"/>
        <rect x="4.5" y="10.3" width="15" height="3.4" rx="1.3"/>
        <rect x="4.5" y="15.2" width="15" height="3.4" rx="1.3"/>
      </g>
    </symbol>
    <symbol id="arch-ic-gear" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="5.6"/>
        <circle cx="12" cy="12" r="2"/>
        <path d="M12 6.4V3.9M12 20.1v-2.5M17.6 12h2.5M3.9 12h2.5M16 8l1.8-1.8M6.2 17.8 8 16M16 16l1.8 1.8M6.2 6.2 8 8"/>
      </g>
    </symbol>
    <symbol id="arch-ic-db" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <ellipse cx="12" cy="6.3" rx="6.8" ry="2.7"/>
        <path d="M5.2 6.3v11.2c0 1.5 3 2.8 6.8 2.8s6.8-1.3 6.8-2.8V6.3"/>
        <path d="M5.2 11.9c0 1.5 3 2.8 6.8 2.8s6.8-1.3 6.8-2.8"/>
      </g>
    </symbol>
    <symbol id="arch-ic-bolt" viewBox="0 0 24 24">
      <path d="M13.2 3.4 6.6 13.3h4.4L10.6 20.6 17.4 10.5h-4.5Z"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="arch-ic-box" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4.8" width="16" height="4.4" rx="1"/>
        <path d="M5.8 9.2v8.2c0 1 .8 1.8 1.8 1.8h8.8c1 0 1.8-.8 1.8-1.8V9.2M10 13h4"/>
      </g>
    </symbol>
    <symbol id="arch-ic-pulse" viewBox="0 0 24 24">
      <path d="M3.4 12.6h3.9l2.4-5.8 3.6 10.6 2.5-4.8h4.8"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <style>
      .arch-t  { font-size: 13.5px; font-weight: 600; fill: #1F2A37; }
      .arch-s  { font-size: 10px;   fill: #67737F; }
      .arch-el { font-size: 10px; font-weight: 500; fill: #4E5A66;
                 paint-order: stroke; stroke: #FBFCFD; stroke-width: 3px; stroke-linejoin: round; }
      .arch-zl { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
      .arch-zd { font-size: 10.5px; fill: #73808D;
                 paint-order: stroke; stroke: #FBFCFD; stroke-width: 3px; stroke-linejoin: round; }
      .arch-node { fill: #FFFFFF; stroke-width: 1.25; }
      .arch-edge { fill: none; stroke: #76828F; stroke-width: 1.4; }
      .arch-tel  { fill: none; stroke: #9AA6B2; stroke-width: 1.3; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1240" height="880" fill="#FBFCFD"/>

  <!-- heading -->
  <text x="60" y="46" font-size="20" font-weight="650" fill="#1F2A37">Web Platform Architecture</text>
  <text x="60" y="68" font-size="11" fill="#67737F">Edge → application → data request path, async job processing, and centralised observability</text>

  <!-- zones -->
  <g id="arch-zones">
    <rect x="60" y="160" width="920" height="150" rx="14" fill="#EFF5FB" stroke="#C3D7EA"/>
    <text x="78" y="190" class="arch-zl" fill="#275E9E">EDGE</text>
    <text x="962" y="190" class="arch-zd" text-anchor="end">ingress · caching · filtering</text>

    <rect x="60" y="355" width="920" height="285" rx="14" fill="#F4F1FA" stroke="#D7CCEC"/>
    <text x="78" y="383" class="arch-zl" fill="#5E4494">APPLICATION</text>
    <text x="962" y="383" class="arch-zd" text-anchor="end">stateless services · async jobs</text>

    <rect x="60" y="685" width="920" height="145" rx="14" fill="#EDF7F3" stroke="#BFDFD4"/>
    <text x="78" y="713" class="arch-zl" fill="#0F6B57">DATA</text>
    <text x="962" y="814" class="arch-zd" text-anchor="end">persistence · cache · objects</text>
  </g>

  <!-- connectors -->
  <g id="arch-edges">
    <path class="arch-edge" d="M215 140 V202" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M310 237 H427" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M620 237 H737" marker-end="url(#arch-arr)"/>

    <path class="arch-edge" d="M835 269 C835 332 215 330 215 397" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M835 269 C835 320 525 330 525 397" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M835 269 V397" marker-end="url(#arch-arr)"/>

    <path class="arch-edge" d="M215 464 V727" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M510 464 V727" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M835 464 V727" marker-end="url(#arch-arr)"/>

    <path class="arch-edge" d="M545 464 C545 502 450 496 450 527" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M805 464 C740 478 580 505 519 543" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M515 562 H632" marker-end="url(#arch-arr)"/>

    <path class="arch-edge" d="M690 594 C690 652 575 660 575 727" marker-end="url(#arch-arr)"/>
    <path class="arch-edge" d="M770 594 C770 650 790 665 790 727" marker-end="url(#arch-arr)"/>
  </g>

  <!-- telemetry rail -->
  <g id="arch-telemetry">
    <path class="arch-tel" d="M980 237 H1002 V478 H1017" marker-end="url(#arch-arrd)"/>
    <path class="arch-tel" d="M980 497 H1017" marker-end="url(#arch-arrd)"/>
    <path class="arch-tel" d="M980 757 H1002 V514 H1017" marker-end="url(#arch-arrd)"/>
  </g>

  <!-- connector labels -->
  <g id="arch-edge-labels">
    <text x="223" y="170" class="arch-el">HTTPS</text>
    <text x="369" y="228" class="arch-el" text-anchor="middle">cache miss</text>
    <text x="679" y="228" class="arch-el" text-anchor="middle">filtered traffic</text>
    <text x="843" y="322" class="arch-el">HTTP</text>
    <text x="223" y="606" class="arch-el">sessions · cache</text>
    <text x="518" y="666" class="arch-el">reads / writes</text>
    <text x="843" y="666" class="arch-el">uploads</text>
    <text x="560" y="505" class="arch-el">enqueue jobs</text>
    <text x="574" y="553" class="arch-el" text-anchor="middle">consume</text>
    <text x="598" y="678" class="arch-el">job results</text>
    <text x="798" y="700" class="arch-el">artifacts</text>
  </g>

  <!-- external actor -->
  <g id="arch-users" color="#5A6B7E">
    <rect x="140" y="84" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#AEB8C2" stroke-dasharray="5 4" stroke-width="1.25"/>
    <use href="#arch-ic-users" x="154" y="100" width="24" height="24"/>
    <text x="188" y="107" class="arch-t">Clients</text>
    <text x="188" y="123" class="arch-s">web · mobile · API</text>
  </g>

  <!-- edge zone nodes -->
  <g id="arch-edge-nodes" color="#275E9E">
    <g>
      <rect x="120" y="205" width="190" height="64" rx="10" class="arch-node" stroke="#A9C4E0"/>
      <use href="#arch-ic-cloud" x="136" y="225" width="24" height="24"/>
      <text x="172" y="233" class="arch-t">CDN</text>
      <text x="172" y="250" class="arch-s">edge cache · static assets</text>
    </g>
    <g>
      <rect x="430" y="205" width="190" height="64" rx="10" class="arch-node" stroke="#A9C4E0"/>
      <use href="#arch-ic-shield" x="446" y="225" width="24" height="24"/>
      <text x="482" y="233" class="arch-t">WAF</text>
      <text x="482" y="250" class="arch-s">L7 rules · rate limiting</text>
    </g>
    <g>
      <rect x="740" y="205" width="190" height="64" rx="10" class="arch-node" stroke="#A9C4E0"/>
      <use href="#arch-ic-lb" x="756" y="225" width="24" height="24"/>
      <text x="792" y="233" class="arch-t">Load Balancer</text>
      <text x="792" y="250" class="arch-s">TLS · health checks</text>
    </g>
  </g>

  <!-- application zone nodes -->
  <g id="arch-app-nodes" color="#5E4494">
    <g>
      <rect x="120" y="400" width="190" height="64" rx="10" class="arch-node" stroke="#C2B3E2"/>
      <use href="#arch-ic-key" x="136" y="420" width="24" height="24"/>
      <text x="172" y="428" class="arch-t">Auth Service</text>
      <text x="172" y="445" class="arch-s">identity · tokens</text>
    </g>
    <g>
      <rect x="430" y="400" width="190" height="64" rx="10" class="arch-node" stroke="#C2B3E2"/>
      <use href="#arch-ic-api" x="446" y="420" width="24" height="24"/>
      <text x="482" y="428" class="arch-t">API Service</text>
      <text x="482" y="445" class="arch-s">core REST / gRPC</text>
    </g>
    <g>
      <rect x="740" y="400" width="190" height="64" rx="10" class="arch-node" stroke="#C2B3E2"/>
      <use href="#arch-ic-media" x="756" y="420" width="24" height="24"/>
      <text x="792" y="428" class="arch-t">Media Service</text>
      <text x="792" y="445" class="arch-s">uploads · transcodes</text>
    </g>
    <g>
      <rect x="325" y="530" width="190" height="64" rx="10" class="arch-node" stroke="#C2B3E2"/>
      <use href="#arch-ic-queue" x="341" y="550" width="24" height="24"/>
      <text x="377" y="558" class="arch-t">Message Queue</text>
      <text x="377" y="575" class="arch-s">work topics · retries</text>
    </g>
    <g>
      <rect x="635" y="530" width="190" height="64" rx="10" class="arch-node" stroke="#C2B3E2"/>
      <use href="#arch-ic-gear" x="651" y="550" width="24" height="24"/>
      <text x="687" y="558" class="arch-t">Worker Pool</text>
      <text x="687" y="575" class="arch-s">async consumers · ×N</text>
    </g>
  </g>

  <!-- data zone nodes -->
  <g id="arch-data-nodes" color="#0F6B57">
    <g>
      <rect x="120" y="730" width="190" height="64" rx="10" class="arch-node" stroke="#9CCBBB"/>
      <use href="#arch-ic-bolt" x="136" y="750" width="24" height="24"/>
      <text x="172" y="758" class="arch-t">Redis</text>
      <text x="172" y="775" class="arch-s">sessions · hot cache</text>
    </g>
    <g>
      <rect x="430" y="730" width="190" height="64" rx="10" class="arch-node" stroke="#9CCBBB"/>
      <use href="#arch-ic-db" x="446" y="750" width="24" height="24"/>
      <text x="482" y="758" class="arch-t">PostgreSQL</text>
      <text x="482" y="775" class="arch-s">primary + read replicas</text>
    </g>
    <g>
      <rect x="740" y="730" width="190" height="64" rx="10" class="arch-node" stroke="#9CCBBB"/>
      <use href="#arch-ic-box" x="756" y="750" width="24" height="24"/>
      <text x="792" y="758" class="arch-t">Object Storage</text>
      <text x="792" y="775" class="arch-s">assets · artifacts</text>
    </g>
  </g>

  <!-- monitoring -->
  <g id="arch-monitoring" color="#8A5A14">
    <rect x="1020" y="455" width="190" height="80" rx="10" fill="#FFF9EE" stroke="#E3CD9E" stroke-width="1.25"/>
    <use href="#arch-ic-pulse" x="1034" y="483" width="24" height="24"/>
    <text x="1070" y="486" class="arch-t">Monitoring</text>
    <text x="1070" y="503" class="arch-s">metrics · logs · traces</text>
    <text x="1070" y="518" class="arch-s">dashboards · alerting</text>
  </g>

  <!-- legend -->
  <g id="arch-legend">
    <path class="arch-edge" d="M60 854 H90" marker-end="url(#arch-arr)"/>
    <text x="102" y="858" class="arch-s">request / data flow</text>
    <path class="arch-tel" d="M235 854 H265" marker-end="url(#arch-arrd)"/>
    <text x="277" y="858" class="arch-s">telemetry to monitoring</text>
  </g>
</svg>
