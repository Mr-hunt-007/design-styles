<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" role="img" aria-labelledby="ad-title ad-desc"
     font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="ad-title">Web platform architecture</title>
  <desc id="ad-desc">Clients reach a CDN, WAF and load balancer in the edge zone; traffic is routed to three
  application services (API, Web, Auth) which use a message queue consumed by a worker pool; the data zone
  holds PostgreSQL, Redis and object storage. A monitoring panel receives telemetry from all three zones.</desc>

  <defs>
    <!-- arrowheads -->
    <marker id="ad-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8.6 5 L0 8.8 Z" fill="#64748B"/>
    </marker>
    <marker id="ad-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L8.6 5 L0 8.8 Z" fill="#D97706"/>
    </marker>

    <!-- shared node card: white body + accent icon tile (tile colour via currentColor) -->
    <g id="ad-card">
      <rect width="180" height="64" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="12" y="14" width="36" height="36" rx="9" fill="currentColor" fill-opacity="0.1"/>
    </g>

    <!-- icon set: 24-unit grid, single 1.8-unit stroke, round joins -->
    <symbol id="ad-ic-browser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="12" rx="1.8"/>
      <path d="M12 16.5 V20 M8.5 20 H15.5"/>
    </symbol>
    <symbol id="ad-ic-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.2"/>
      <path d="M3.8 12 H20.2"/>
      <ellipse cx="12" cy="12" rx="3.6" ry="8.2"/>
    </symbol>
    <symbol id="ad-ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 L19 6.2 V11.5 C19 15.8 16.2 19.1 12 20.5 C7.8 19.1 5 15.8 5 11.5 V6.2 Z"/>
      <path d="M9 11.8 L11.2 14 L15.2 9.6"/>
    </symbol>
    <symbol id="ad-ic-split" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 12 H9 M9 12 L16.5 5.5 M9 12 H16.5 M9 12 L16.5 18.5"/>
      <g fill="currentColor" stroke="none">
        <circle cx="18.6" cy="5.5" r="1.7"/>
        <circle cx="18.6" cy="12" r="1.7"/>
        <circle cx="18.6" cy="18.5" r="1.7"/>
      </g>
    </symbol>
    <symbol id="ad-ic-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 7.5 L4.5 12 L9 16.5 M15 7.5 L19.5 12 L15 16.5"/>
    </symbol>
    <symbol id="ad-ic-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
      <path d="M3.5 9 H20.5 M7 13 H14 M7 16 H11"/>
    </symbol>
    <symbol id="ad-ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10.5" width="12" height="9" rx="2"/>
      <path d="M8.5 10.5 V8 a3.5 3.5 0 0 1 7 0 V10.5"/>
      <circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ad-ic-queue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4.5" width="13" height="3.6" rx="1.8"/>
      <rect x="7" y="10.2" width="13" height="3.6" rx="1.8"/>
      <rect x="4" y="15.9" width="13" height="3.6" rx="1.8"/>
    </symbol>
    <symbol id="ad-ic-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 4.5 V7 M12 17 V19.5 M4.5 12 H7 M17 12 H19.5 M6.7 6.7 L8.5 8.5 M15.5 15.5 L17.3 17.3 M17.3 6.7 L15.5 8.5 M8.5 15.5 L6.7 17.3"/>
    </symbol>
    <symbol id="ad-ic-db" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="6.5" rx="7.5" ry="3"/>
      <path d="M4.5 6.5 V17.5 C4.5 19.2 7.9 20.5 12 20.5 C16.1 20.5 19.5 19.2 19.5 17.5 V6.5"/>
      <path d="M4.5 12 C4.5 13.7 7.9 15 12 15 C16.1 15 19.5 13.7 19.5 12"/>
    </symbol>
    <symbol id="ad-ic-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 3.5 L6 13.5 H11 L10.5 20.5 L17.5 10.5 H12.5 Z"/>
    </symbol>
    <symbol id="ad-ic-bucket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 7.2 L6.7 18.9 a2 2 0 0 0 2 1.7 H15.3 a2 2 0 0 0 2 -1.7 L19 7.2"/>
      <ellipse cx="12" cy="7" rx="7" ry="2.3"/>
    </symbol>
    <symbol id="ad-ic-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12 H8 L10.5 6.5 L13.5 17.5 L16 12 H20.5"/>
    </symbol>
  </defs>

  <!-- ground -->
  <rect width="1240" height="920" fill="#F7F9FC"/>

  <!-- heading -->
  <text x="70" y="54" font-size="24" font-weight="700" fill="#0F172A">Web Platform Architecture</text>
  <text x="70" y="78" font-size="12.5" fill="#64748B">Request path, async processing and persistence · every zone exports telemetry</text>

  <!-- zone bands -->
  <g id="ad-zones">
    <rect x="70" y="180" width="910" height="150" rx="14" fill="#2563EB" fill-opacity="0.05" stroke="#2563EB" stroke-opacity="0.28" stroke-width="1.25"/>
    <text x="94" y="208" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#2563EB">EDGE</text>
    <text x="150" y="208" font-size="11" fill="#64748B">· ingress &amp; protection</text>

    <rect x="70" y="380" width="910" height="260" rx="14" fill="#7C3AED" fill-opacity="0.045" stroke="#7C3AED" stroke-opacity="0.28" stroke-width="1.25"/>
    <text x="94" y="408" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#7C3AED">APPLICATION</text>
    <text x="216" y="408" font-size="11" fill="#64748B">· stateless services &amp; async work</text>

    <rect x="70" y="690" width="910" height="140" rx="14" fill="#0D9488" fill-opacity="0.05" stroke="#0D9488" stroke-opacity="0.28" stroke-width="1.25"/>
    <text x="94" y="718" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#0F766E">DATA</text>
    <text x="152" y="718" font-size="11" fill="#64748B">· state &amp; persistence</text>

    <rect x="1010" y="400" width="170" height="230" rx="14" fill="#D97706" fill-opacity="0.06" stroke="#D97706" stroke-opacity="0.35" stroke-width="1.25"/>
  </g>

  <!-- connectors -->
  <g id="ad-flows" fill="none" stroke="#64748B" stroke-width="1.5">
    <path d="M285 144 V222" marker-end="url(#ad-arr)"/>
    <path d="M379 258 H431" marker-end="url(#ad-arr)"/>
    <path d="M619 258 H671" marker-end="url(#ad-arr)"/>
    <path d="M705 294 V336 Q705 344 697 344 H293 Q285 344 285 352 V416" marker-end="url(#ad-arr)"/>
    <path d="M735 294 V354 Q735 362 727 362 H533 Q525 362 525 370 V416" marker-end="url(#ad-arr)"/>
    <path d="M765 294 V416" marker-end="url(#ad-arr)"/>
    <path d="M265 488 V732" marker-end="url(#ad-arr)"/>
    <path d="M325 488 V512 Q325 520 333 520 H397 Q405 520 405 528 V544" marker-end="url(#ad-arr)"/>
    <path d="M545 488 V732" marker-end="url(#ad-arr)"/>
    <path d="M745 488 V504 Q745 512 737 512 H583 Q575 512 575 520 V732" marker-end="url(#ad-arr)"/>
    <path d="M524 580 H606" marker-end="url(#ad-arr)"/>
    <path d="M765 616 V732" marker-end="url(#ad-arr)"/>
  </g>
  <g id="ad-telemetry" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M984 258 H988 Q996 258 996 266 V437 Q996 445 1004 445 H1006" marker-end="url(#ad-arr-amber)"/>
    <path d="M984 510 H1006" marker-end="url(#ad-arr-amber)"/>
    <path d="M984 760 H988 Q996 760 996 752 V583 Q996 575 1004 575 H1006" marker-end="url(#ad-arr-amber)"/>
  </g>

  <!-- connector labels -->
  <g id="ad-flow-labels" font-size="10.5" fill="#64748B" stroke="#F7F9FC" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="293" y="190">https</text>
    <text x="340" y="514">enqueue</text>
    <text x="565" y="571" text-anchor="middle">jobs</text>
    <text x="273" y="660">sql</text>
    <text x="537" y="652" text-anchor="end">cache</text>
    <text x="583" y="678">sessions</text>
    <text x="773" y="672">artifacts</text>
    <text x="995" y="500" text-anchor="middle">telemetry</text>
  </g>

  <!-- nodes -->
  <g id="ad-nodes">
    <!-- clients pill -->
    <g>
      <rect x="210" y="100" width="150" height="44" rx="22" fill="#FFFFFF" stroke="#CBD5E1"/>
      <use href="#ad-ic-browser" x="232" y="112" width="20" height="20" color="#475569"/>
      <text x="262" y="127" font-size="13.5" font-weight="600" fill="#0F172A">Clients</text>
    </g>

    <!-- edge zone -->
    <use href="#ad-card" x="195" y="226" color="#2563EB"/>
    <use href="#ad-ic-globe" x="214" y="247" width="22" height="22" color="#2563EB"/>
    <text x="257" y="254" font-size="13.5" font-weight="600" fill="#0F172A">CDN</text>
    <text x="257" y="272" font-size="11" fill="#64748B">static edge cache</text>

    <use href="#ad-card" x="435" y="226" color="#2563EB"/>
    <use href="#ad-ic-shield" x="454" y="247" width="22" height="22" color="#2563EB"/>
    <text x="497" y="254" font-size="13.5" font-weight="600" fill="#0F172A">WAF</text>
    <text x="497" y="272" font-size="11" fill="#64748B">L7 rules · rate limits</text>

    <use href="#ad-card" x="675" y="226" color="#2563EB"/>
    <use href="#ad-ic-split" x="694" y="247" width="22" height="22" color="#2563EB"/>
    <text x="737" y="254" font-size="13.5" font-weight="600" fill="#0F172A">Load Balancer</text>
    <text x="737" y="272" font-size="11" fill="#64748B">TLS · health checks</text>

    <!-- application zone -->
    <use href="#ad-card" x="195" y="420" color="#7C3AED"/>
    <use href="#ad-ic-code" x="214" y="441" width="22" height="22" color="#7C3AED"/>
    <text x="257" y="448" font-size="13.5" font-weight="600" fill="#0F172A">API Service</text>
    <text x="257" y="466" font-size="11" fill="#64748B">REST · GraphQL</text>

    <use href="#ad-card" x="435" y="420" color="#7C3AED"/>
    <use href="#ad-ic-window" x="454" y="441" width="22" height="22" color="#7C3AED"/>
    <text x="497" y="448" font-size="13.5" font-weight="600" fill="#0F172A">Web Service</text>
    <text x="497" y="466" font-size="11" fill="#64748B">SSR frontend</text>

    <use href="#ad-card" x="675" y="420" color="#7C3AED"/>
    <use href="#ad-ic-lock" x="694" y="441" width="22" height="22" color="#7C3AED"/>
    <text x="737" y="448" font-size="13.5" font-weight="600" fill="#0F172A">Auth Service</text>
    <text x="737" y="466" font-size="11" fill="#64748B">identity · tokens</text>

    <use href="#ad-card" x="340" y="548" color="#7C3AED"/>
    <use href="#ad-ic-queue" x="359" y="569" width="22" height="22" color="#7C3AED"/>
    <text x="402" y="576" font-size="13.5" font-weight="600" fill="#0F172A">Message Queue</text>
    <text x="402" y="594" font-size="11" fill="#64748B">async jobs</text>

    <use href="#ad-card" x="610" y="548" color="#7C3AED"/>
    <use href="#ad-ic-gear" x="629" y="569" width="22" height="22" color="#7C3AED"/>
    <text x="672" y="576" font-size="13.5" font-weight="600" fill="#0F172A">Worker Pool</text>
    <text x="672" y="594" font-size="11" fill="#64748B">queue consumers</text>

    <!-- data zone -->
    <use href="#ad-card" x="195" y="736" color="#0D9488"/>
    <use href="#ad-ic-db" x="214" y="757" width="22" height="22" color="#0D9488"/>
    <text x="257" y="764" font-size="13.5" font-weight="600" fill="#0F172A">PostgreSQL</text>
    <text x="257" y="782" font-size="11" fill="#64748B">primary datastore</text>

    <use href="#ad-card" x="435" y="736" color="#0D9488"/>
    <use href="#ad-ic-bolt" x="454" y="757" width="22" height="22" color="#0D9488"/>
    <text x="497" y="764" font-size="13.5" font-weight="600" fill="#0F172A">Redis</text>
    <text x="497" y="782" font-size="11" fill="#64748B">cache · sessions</text>

    <use href="#ad-card" x="675" y="736" color="#0D9488"/>
    <use href="#ad-ic-bucket" x="694" y="757" width="22" height="22" color="#0D9488"/>
    <text x="737" y="764" font-size="13.5" font-weight="600" fill="#0F172A">Object Storage</text>
    <text x="737" y="782" font-size="11" fill="#64748B">assets · uploads</text>
  </g>

  <!-- monitoring panel content -->
  <g id="ad-monitoring">
    <text x="1030" y="430" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#B45309">MONITORING</text>
    <rect x="1030" y="444" width="36" height="36" rx="9" fill="#D97706" fill-opacity="0.12"/>
    <use href="#ad-ic-pulse" x="1037" y="451" width="22" height="22" color="#B45309"/>
    <g font-size="11.5" fill="#0F172A">
      <circle cx="1036" cy="512" r="2" fill="#D97706"/><text x="1046" y="516">Metrics</text>
      <circle cx="1036" cy="536" r="2" fill="#D97706"/><text x="1046" y="540">Logs</text>
      <circle cx="1036" cy="560" r="2" fill="#D97706"/><text x="1046" y="564">Traces</text>
      <circle cx="1036" cy="584" r="2" fill="#D97706"/><text x="1046" y="588">Alerts</text>
    </g>
    <text x="1030" y="612" font-size="10.5" fill="#64748B">scrapes every zone</text>
  </g>

  <!-- legend -->
  <g id="ad-legend" font-size="11" fill="#64748B">
    <path d="M70 884 H106" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ad-arr)"/>
    <text x="118" y="888">request / data flow</text>
    <path d="M250 884 H286" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ad-arr-amber)"/>
    <text x="298" y="888">telemetry</text>
  </g>
</svg>
