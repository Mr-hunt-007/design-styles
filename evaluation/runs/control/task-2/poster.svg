<svg xmlns="http://www.w3.org/2000/svg" width="842" height="1191" viewBox="0 0 842 1191" role="img" aria-label="Credential stuffing: how the attack works and how to defend against it">
  <title>Credential Stuffing: Attack and Defence</title>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #EAF0FB; }
    .kicker { font-size: 11px; letter-spacing: 3.5px; font-weight: 700; fill: #8CA0C0; }
    .title { font-size: 64px; font-weight: 800; letter-spacing: 1px; }
    .title-red { fill: #F43F5E; }
    .subtitle { font-size: 15px; fill: #A9BAD6; }
    .statnum { font-size: 34px; font-weight: 800; }
    .statlbl { font-size: 10.5px; fill: #8CA0C0; }
    .secnum { font-size: 18px; font-weight: 800; }
    .sechead { font-size: 21px; font-weight: 800; letter-spacing: 1.5px; }
    .stepnum { font-size: 13px; font-weight: 800; fill: #F43F5E; }
    .steptitle { font-size: 14.5px; font-weight: 800; letter-spacing: 0.4px; }
    .stepdesc { font-size: 11.5px; fill: #A9BAD6; }
    .paneltitle { font-size: 13px; font-weight: 800; letter-spacing: 2px; fill: #F5A524; }
    .bignum { font-size: 42px; font-weight: 800; fill: #F5A524; }
    .panelsm { font-size: 10.5px; fill: #A9BAD6; }
    .locklbl { font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #8CA0C0; }
    .cardtitle { font-size: 13.5px; font-weight: 800; letter-spacing: 0.3px; }
    .carddesc { font-size: 10.5px; fill: #A9BAD6; }
    .tag { font-size: 8.5px; font-weight: 800; letter-spacing: 1.2px; }
    .takeaway { font-size: 21px; font-weight: 800; letter-spacing: 0.5px; }
    .takeaway2 { font-size: 11.5px; fill: #A9BAD6; }
    .foot { font-size: 9px; fill: #5E7190; }
    .ic { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="0.5" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <g id="ic-key" class="ic">
      <circle cx="7" cy="16" r="4.2"/>
      <path d="M10.2 12.8 L20 3 M16.4 6.6 l3 3"/>
    </g>
    <g id="ic-shield" class="ic">
      <path d="M12 2.5 L20 5.6 V11 c0 5 -3.4 8.6 -8 10.6 C7.4 19.6 4 16 4 11 V5.6 Z"/>
      <path d="M8.6 11.6 l2.4 2.4 L15.6 9"/>
    </g>
    <g id="ic-list" class="ic">
      <path d="M4 6.5 h10 M4 11.5 h8 M4 16.5 h6"/>
      <path d="M14 15.5 l2.6 2.6 L21 13.5"/>
    </g>
    <g id="ic-gauge" class="ic">
      <path d="M4.5 17 a7.5 7.5 0 0 1 15 0"/>
      <path d="M12 17 L16.4 10.4"/>
      <circle cx="12" cy="17" r="1.4"/>
    </g>
    <g id="ic-fingerprint" class="ic">
      <path d="M6 11.5 a6 6 0 0 1 12 0 v3"/>
      <path d="M9 11.5 a3 3 0 0 1 6 0 v5.5"/>
      <path d="M12 11.5 v8"/>
    </g>
    <g id="ic-pulse" class="ic">
      <path d="M3 13 h4.5 L10 6.5 L13.5 18 L15.5 11.5 h5.5"/>
    </g>
    <g id="ic-refresh" class="ic">
      <path d="M19.5 12.5 a7.5 7.5 0 1 1 -2.2 -5.3"/>
      <path d="M19.8 3.4 v4.2 h-4.2"/>
    </g>
    <g id="ic-lock" class="ic">
      <rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/>
      <path d="M8.5 10.5 V7.5 a3.5 3.5 0 0 1 7 0 v3"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="842" height="1191" fill="#0A1120"/>
  <rect x="0" y="0" width="842" height="6" fill="url(#topbar)"/>

  <!-- decorative padlock, top right -->
  <g transform="translate(652,44) scale(6.4)" opacity="0.10">
    <use href="#ic-lock" stroke="#22D3EE"/>
  </g>

  <!-- ===== header ===== -->
  <text class="kicker" x="48" y="64">THREAT BRIEFING · OWASP AUTOMATED THREAT OAT-008</text>
  <text class="title" x="46" y="132">CREDENTIAL</text>
  <text class="title title-red" x="46" y="198">STUFFING</text>
  <text class="subtitle" x="48" y="228">How recycled passwords become account takeovers, and the controls that stop them.</text>

  <!-- ===== stats band ===== -->
  <g>
    <rect x="48" y="250" width="238" height="76" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <text class="statnum" x="66" y="294" fill="#F43F5E">24B+</text>
    <text class="statlbl" x="66" y="312">stolen credential pairs circulating online</text>

    <rect x="302" y="250" width="238" height="76" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <text class="statnum" x="320" y="294" fill="#F5A524">0.1&#8211;2%</text>
    <text class="statlbl" x="320" y="312">of attempts succeed: devastating at scale</text>

    <rect x="556" y="250" width="238" height="76" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <text class="statnum" x="574" y="294" fill="#22D3EE">~65%</text>
    <text class="statlbl" x="574" y="312">of users reuse passwords across accounts</text>
  </g>

  <!-- ===== section 01: attack ===== -->
  <text class="secnum" x="48" y="366" fill="#F43F5E">01</text>
  <text class="sechead" x="80" y="366">HOW THE ATTACK WORKS</text>
  <line x1="48" y1="378" x2="794" y2="378" stroke="#1F2D47" stroke-width="1"/>

  <!-- step chain -->
  <line x1="70" y1="398" x2="70" y2="646" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
  <g>
    <circle cx="70" cy="398" r="15" fill="#2A1420" stroke="#F43F5E" stroke-width="1.5"/>
    <text class="stepnum" x="70" y="403" text-anchor="middle">1</text>
    <text class="steptitle" x="100" y="396">BREACH HARVEST</text>
    <text class="stepdesc" x="100" y="414">Passwords are stolen from one site via breaches and infostealers.</text>

    <circle cx="70" cy="460" r="15" fill="#2A1420" stroke="#F43F5E" stroke-width="1.5"/>
    <text class="stepnum" x="70" y="465" text-anchor="middle">2</text>
    <text class="steptitle" x="100" y="458">COMBOLISTS TRADED</text>
    <text class="stepdesc" x="100" y="476">Email + password pairs are packaged and sold on criminal markets.</text>

    <circle cx="70" cy="522" r="15" fill="#2A1420" stroke="#F43F5E" stroke-width="1.5"/>
    <text class="stepnum" x="70" y="527" text-anchor="middle">3</text>
    <text class="steptitle" x="100" y="520">AUTOMATION CONFIGURED</text>
    <text class="stepdesc" x="100" y="538">Stuffing tools load the list plus a per-site login "config".</text>

    <circle cx="70" cy="584" r="15" fill="#2A1420" stroke="#F43F5E" stroke-width="1.5"/>
    <text class="stepnum" x="70" y="589" text-anchor="middle">4</text>
    <text class="steptitle" x="100" y="582">DISTRIBUTED REPLAY</text>
    <text class="stepdesc" x="100" y="600">Botnets and residential proxies spread logins across 1000s of IPs.</text>

    <circle cx="70" cy="646" r="15" fill="#2A1420" stroke="#F43F5E" stroke-width="1.5"/>
    <text class="stepnum" x="70" y="651" text-anchor="middle">5</text>
    <text class="steptitle" x="100" y="644">TAKEOVER + MONETISE</text>
    <text class="stepdesc" x="100" y="662">Valid hits are drained, resold, or used for fraud and phishing.</text>
  </g>

  <!-- why it works panel -->
  <g>
    <rect x="514" y="384" width="280" height="282" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="514" y="384" width="4" height="282" rx="2" fill="#F5A524"/>
    <text class="paneltitle" x="534" y="412">WHY IT WORKS</text>
    <text class="bignum" x="534" y="460">65%</text>
    <text class="panelsm" x="640" y="444">of users reuse the</text>
    <text class="panelsm" x="640" y="458">same password on</text>
    <text class="panelsm" x="640" y="472">multiple accounts</text>
    <line x1="534" y1="486" x2="774" y2="486" stroke="#1F2D47"/>

    <!-- one key, many locks -->
    <g transform="translate(540,516) scale(1.3)">
      <use href="#ic-key" stroke="#F5A524"/>
    </g>
    <path d="M582 532 L676 508" stroke="#F5A524" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
    <path d="M582 532 L676 534" stroke="#F5A524" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
    <path d="M582 532 L676 560" stroke="#F5A524" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
    <g transform="translate(682,494) scale(0.85)"><use href="#ic-lock" stroke="#F43F5E"/></g>
    <text class="locklbl" x="708" y="508">EMAIL</text>
    <g transform="translate(682,522) scale(0.85)"><use href="#ic-lock" stroke="#F43F5E"/></g>
    <text class="locklbl" x="708" y="536">BANK</text>
    <g transform="translate(682,550) scale(0.85)"><use href="#ic-lock" stroke="#F43F5E"/></g>
    <text class="locklbl" x="708" y="564">RETAIL</text>

    <text class="panelsm" x="534" y="596">&#8226;  One reused password opens every</text>
    <text class="panelsm" x="545" y="609">account it guards.</text>
    <text class="panelsm" x="534" y="627">&#8226;  Valid credentials look like normal</text>
    <text class="panelsm" x="545" y="640">sign-ins to basic filters.</text>
    <text class="panelsm" x="534" y="658">&#8226;  Proxies make millions of tries cheap.</text>
  </g>

  <!-- ===== section 02: defence ===== -->
  <text class="secnum" x="48" y="706" fill="#22D3EE">02</text>
  <text class="sechead" x="80" y="706">HOW TO DEFEND</text>
  <text class="subtitle" x="300" y="705" font-size="12">Layer controls so a valid password is never enough on its own.</text>
  <line x1="48" y1="718" x2="794" y2="718" stroke="#1F2D47" stroke-width="1"/>

  <!-- defence cards: row 1 -->
  <g>
    <rect x="48" y="736" width="238" height="132" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="62" y="750" width="32" height="32" rx="8" fill="#0E2A22" stroke="#34D399" stroke-opacity="0.4"/>
    <g transform="translate(66,754)"><use href="#ic-key" stroke="#34D399"/></g>
    <rect x="212" y="752" width="60" height="18" rx="9" fill="none" stroke="#34D399" stroke-opacity="0.6"/>
    <text class="tag" x="242" y="764" text-anchor="middle" fill="#34D399">PREVENT</text>
    <text class="cardtitle" x="62" y="808">PASSKEYS + MFA</text>
    <text class="carddesc" x="62" y="828">Phishing-resistant factors make a</text>
    <text class="carddesc" x="62" y="842">stolen password useless on its own.</text>
    <text class="carddesc" x="62" y="856">Prioritise admin + high-value users.</text>
  </g>
  <g>
    <rect x="302" y="736" width="238" height="132" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="316" y="750" width="32" height="32" rx="8" fill="#0E2A22" stroke="#34D399" stroke-opacity="0.4"/>
    <g transform="translate(320,754)"><use href="#ic-list" stroke="#34D399"/></g>
    <rect x="466" y="752" width="60" height="18" rx="9" fill="none" stroke="#34D399" stroke-opacity="0.6"/>
    <text class="tag" x="496" y="764" text-anchor="middle" fill="#34D399">PREVENT</text>
    <text class="cardtitle" x="316" y="808">BREACH-LIST SCREENING</text>
    <text class="carddesc" x="316" y="828">Check passwords against known leak</text>
    <text class="carddesc" x="316" y="842">corpora at signup, login and reset.</text>
    <text class="carddesc" x="316" y="856">Block or force-rotate any match.</text>
  </g>
  <g>
    <rect x="556" y="736" width="238" height="132" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="570" y="750" width="32" height="32" rx="8" fill="#0B2733" stroke="#22D3EE" stroke-opacity="0.4"/>
    <g transform="translate(574,754)"><use href="#ic-gauge" stroke="#22D3EE"/></g>
    <rect x="722" y="752" width="58" height="18" rx="9" fill="none" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text class="tag" x="751" y="764" text-anchor="middle" fill="#22D3EE">DETECT</text>
    <text class="cardtitle" x="570" y="808">RATE LIMITS + IP INTEL</text>
    <text class="carddesc" x="570" y="828">Throttle by IP, ASN and fingerprint.</text>
    <text class="carddesc" x="570" y="842">Step-up or challenge bursts and</text>
    <text class="carddesc" x="570" y="856">known proxy / hosting ranges.</text>
  </g>

  <!-- defence cards: row 2 -->
  <g>
    <rect x="48" y="882" width="238" height="132" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="62" y="896" width="32" height="32" rx="8" fill="#0B2733" stroke="#22D3EE" stroke-opacity="0.4"/>
    <g transform="translate(66,900)"><use href="#ic-fingerprint" stroke="#22D3EE"/></g>
    <rect x="212" y="898" width="58" height="18" rx="9" fill="none" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text class="tag" x="241" y="910" text-anchor="middle" fill="#22D3EE">DETECT</text>
    <text class="cardtitle" x="62" y="954">BOT + DEVICE SIGNALS</text>
    <text class="carddesc" x="62" y="974">Headless hints, TLS and behaviour</text>
    <text class="carddesc" x="62" y="988">signals separate replay tooling</text>
    <text class="carddesc" x="62" y="1002">from real customers.</text>
  </g>
  <g>
    <rect x="302" y="882" width="238" height="132" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="316" y="896" width="32" height="32" rx="8" fill="#0B2733" stroke="#22D3EE" stroke-opacity="0.4"/>
    <g transform="translate(320,900)"><use href="#ic-pulse" stroke="#22D3EE"/></g>
    <rect x="466" y="898" width="58" height="18" rx="9" fill="none" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text class="tag" x="495" y="910" text-anchor="middle" fill="#22D3EE">DETECT</text>
    <text class="cardtitle" x="316" y="954">LOGIN TELEMETRY</text>
    <text class="carddesc" x="316" y="974">Alert on failed-login spikes, low</text>
    <text class="carddesc" x="316" y="988">success ratios, new-device floods</text>
    <text class="carddesc" x="316" y="1002">and impossible travel.</text>
  </g>
  <g>
    <rect x="556" y="882" width="238" height="132" rx="10" fill="#111B2E" stroke="#1F2D47"/>
    <rect x="570" y="896" width="32" height="32" rx="8" fill="#2E2210" stroke="#F5A524" stroke-opacity="0.4"/>
    <g transform="translate(574,900)"><use href="#ic-refresh" stroke="#F5A524"/></g>
    <rect x="716" y="898" width="64" height="18" rx="9" fill="none" stroke="#F5A524" stroke-opacity="0.6"/>
    <text class="tag" x="748" y="910" text-anchor="middle" fill="#F5A524">RESPOND</text>
    <text class="cardtitle" x="570" y="954">ATO PLAYBOOK</text>
    <text class="carddesc" x="570" y="974">On confirmed takeover: kill sessions,</text>
    <text class="carddesc" x="570" y="988">force resets, notify users, and feed</text>
    <text class="carddesc" x="570" y="1002">indicators back into blocking.</text>
  </g>

  <!-- ===== takeaway ===== -->
  <g>
    <rect x="48" y="1040" width="746" height="74" rx="10" fill="#0D1A2E" stroke="#1F2D47"/>
    <rect x="48" y="1040" width="4" height="74" rx="2" fill="#22D3EE"/>
    <g transform="translate(72,1060) scale(1.4)"><use href="#ic-shield" stroke="#22D3EE"/></g>
    <text class="takeaway" x="124" y="1072">ASSUME EVERY PASSWORD IS ALREADY BREACHED.</text>
    <text class="takeaway2" x="124" y="1096">No single control stops stuffing. Layer prevention, detection and response so a stolen password is never enough.</text>
  </g>

  <text class="foot" x="48" y="1144">Figures are indicative ranges drawn from public industry threat reports, 2022&#8211;2025.</text>
  <text class="foot" x="794" y="1144" text-anchor="end">OAT-008 &#183; CREDENTIAL STUFFING &#183; A3</text>
</svg>
