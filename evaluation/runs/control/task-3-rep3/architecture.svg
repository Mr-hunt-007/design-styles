<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Web Platform Architecture</title>
  <desc>Edge, application and data zones: CDN, WAF, load balancer, three app services, message queue, worker pool, PostgreSQL, Redis, object storage and a monitoring stack.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1500" height="940" fill="#f8fafc"/>

  <!-- title -->
  <text x="70" y="52" font-size="26" font-weight="650" fill="#0f172a">Web Platform Architecture</text>
  <text x="70" y="78" font-size="13" fill="#64748b">Synchronous request path, asynchronous job processing, persistence and observability</text>

  <!-- ================= ZONES ================= -->
  <!-- Edge zone -->
  <rect x="180" y="110" width="1070" height="190" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="204" y="140" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1d4ed8">EDGE</text>
  <text x="246" y="140" font-size="11" fill="#60a5fa">— traffic ingress &#183; protection</text>

  <!-- App zone -->
  <rect x="180" y="340" width="1070" height="300" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="204" y="370" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6d28d9">APPLICATION</text>
  <text x="314" y="370" font-size="11" fill="#a78bfa">— stateless services &#183; async workers</text>

  <!-- Data zone -->
  <rect x="180" y="690" width="1070" height="170" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="204" y="720" font-size="12" font-weight="700" letter-spacing="1.5" fill="#047857">DATA</text>
  <text x="244" y="720" font-size="11" fill="#34d399">— persistence layer</text>

  <!-- Monitoring panel -->
  <rect x="1290" y="110" width="160" height="750" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <polyline points="1338,146 1350,146 1356,134 1364,156 1370,146 1402,146" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1370" y="180" font-size="12" font-weight="700" letter-spacing="1.3" fill="#c2410c" text-anchor="middle">MONITORING</text>
  <g font-size="11.5" fill="#7c2d12">
    <rect x="1310" y="204" width="120" height="36" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <circle cx="1328" cy="222" r="3.2" fill="#ea580c"/>
    <text x="1340" y="226">Metrics</text>
    <rect x="1310" y="256" width="120" height="36" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <circle cx="1328" cy="274" r="3.2" fill="#ea580c"/>
    <text x="1340" y="278">Logs</text>
    <rect x="1310" y="308" width="120" height="36" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <circle cx="1328" cy="326" r="3.2" fill="#ea580c"/>
    <text x="1340" y="330">Traces</text>
    <rect x="1310" y="360" width="120" height="36" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <circle cx="1328" cy="378" r="3.2" fill="#ea580c"/>
    <text x="1340" y="382">Alerts</text>
  </g>
  <text x="1370" y="838" font-size="10" fill="#c2410c" text-anchor="middle" opacity="0.85">agents on every tier</text>

  <!-- ================= CONNECTORS (under nodes) ================= -->
  <g fill="none" stroke="#64748b" stroke-width="1.8">
    <!-- users -> CDN -->
    <line x1="143" y1="208" x2="226" y2="208" marker-end="url(#arrow)"/>
    <!-- CDN -> WAF -->
    <line x1="450" y1="208" x2="556" y2="208" marker-end="url(#arrow)"/>
    <!-- WAF -> LB -->
    <line x1="760" y1="208" x2="866" y2="208" marker-end="url(#arrow)"/>
    <!-- LB fan-out to services -->
    <path d="M985,246 V320 H310 V396" marker-end="url(#arrow)"/>
    <path d="M530,320 V396" marker-end="url(#arrow)"/>
    <path d="M750,320 V396" marker-end="url(#arrow)"/>
    <!-- services -> queue -->
    <line x1="840" y1="436" x2="891" y2="436" marker-end="url(#arrow)"/>
    <!-- queue -> workers -->
    <line x1="985" y1="470" x2="985" y2="516" marker-end="url(#arrow)"/>
    <!-- data access bus -->
    <path d="M310,472 V665"/>
    <path d="M530,472 V665"/>
    <path d="M750,472 V665"/>
    <path d="M980,604 V665"/>
    <path d="M310,665 H980"/>
    <!-- risers into data stores -->
    <path d="M360,665 V736" marker-end="url(#arrow)"/>
    <path d="M670,665 V736" marker-end="url(#arrow)"/>
    <path d="M980,665 V736" marker-end="url(#arrow)"/>
  </g>
  <!-- junction dots -->
  <g fill="#64748b">
    <circle cx="530" cy="320" r="3.2"/>
    <circle cx="750" cy="320" r="3.2"/>
    <circle cx="310" cy="665" r="3.2"/>
    <circle cx="530" cy="665" r="3.2"/>
    <circle cx="750" cy="665" r="3.2"/>
    <circle cx="980" cy="665" r="3.2"/>
    <circle cx="360" cy="665" r="3.2"/>
    <circle cx="670" cy="665" r="3.2"/>
  </g>
  <!-- telemetry (dashed) zone -> monitoring -->
  <g fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 4">
    <line x1="1252" y1="208" x2="1286" y2="208" marker-end="url(#arrowOrange)"/>
    <line x1="1252" y1="470" x2="1286" y2="470" marker-end="url(#arrowOrange)"/>
    <line x1="1252" y1="775" x2="1286" y2="775" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- connector labels -->
  <g font-size="10.5" fill="#64748b">
    <text x="184" y="198" text-anchor="middle">HTTPS</text>
    <text x="503" y="198" text-anchor="middle">cache miss</text>
    <text x="813" y="198" text-anchor="middle">clean traffic</text>
    <text x="700" y="312" text-anchor="middle">route by host / path</text>
    <text x="866" y="424" text-anchor="middle">jobs</text>
    <text x="995" y="498">consume</text>
    <text x="314" y="656">reads / writes</text>
    <text x="368" y="708">SQL</text>
    <text x="678" y="708">cache</text>
    <text x="930" y="708" text-anchor="end">blobs</text>
  </g>

  <!-- ================= EXTERNAL ACTOR ================= -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="112" cy="194" r="7"/>
    <path d="M99,221 a13,13 0 0 1 26,0"/>
  </g>
  <text x="112" y="244" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Users</text>

  <!-- ================= EDGE NODES ================= -->
  <!-- CDN -->
  <g filter="url(#sh)">
    <rect x="230" y="170" width="220" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#2563eb" stroke-width="1.6" fill="none">
    <circle cx="260" cy="208" r="10"/>
    <ellipse cx="260" cy="208" rx="4.5" ry="10"/>
    <line x1="250" y1="208" x2="270" y2="208"/>
  </g>
  <text x="282" y="205" font-size="14" font-weight="600" fill="#0f172a">CDN</text>
  <text x="282" y="223" font-size="11" fill="#64748b">static cache &#183; TLS at edge</text>

  <!-- WAF -->
  <g filter="url(#sh)">
    <rect x="560" y="170" width="200" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#2563eb" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M590,198 l9,-4 9,4 v8 q0,8 -9,12 q-9,-4 -9,-12 z"/>
    <path d="M595,206 l3,3 6,-6"/>
  </g>
  <text x="614" y="205" font-size="14" font-weight="600" fill="#0f172a">WAF</text>
  <text x="614" y="223" font-size="11" fill="#64748b">OWASP rules &#183; rate limits</text>

  <!-- Load balancer -->
  <g filter="url(#sh)">
    <rect x="870" y="170" width="230" height="76" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#2563eb" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="892" y1="208" x2="900" y2="208"/>
    <line x1="900" y1="208" x2="912" y2="198"/>
    <line x1="900" y1="208" x2="912" y2="208"/>
    <line x1="900" y1="208" x2="912" y2="218"/>
    <circle cx="915" cy="198" r="1.6" fill="#2563eb"/>
    <circle cx="915" cy="208" r="1.6" fill="#2563eb"/>
    <circle cx="915" cy="218" r="1.6" fill="#2563eb"/>
  </g>
  <text x="930" y="205" font-size="14" font-weight="600" fill="#0f172a">Load Balancer</text>
  <text x="930" y="223" font-size="11" fill="#64748b">L7 routing &#183; health checks</text>

  <!-- ================= APP NODES ================= -->
  <!-- API service -->
  <g filter="url(#sh)">
    <rect x="220" y="400" width="180" height="72" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246,429 l-7,7 7,7"/>
    <path d="M260,429 l7,7 -7,7"/>
  </g>
  <text x="280" y="433" font-size="14" font-weight="600" fill="#0f172a">API Service</text>
  <text x="280" y="451" font-size="11" fill="#64748b">REST + GraphQL</text>

  <!-- Web frontend -->
  <g filter="url(#sh)">
    <rect x="440" y="400" width="180" height="72" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.6" fill="none">
    <rect x="458" y="427" width="20" height="16" rx="2.5"/>
    <line x1="458" y1="432" x2="478" y2="432"/>
    <circle cx="461.5" cy="429.5" r="0.9" fill="#7c3aed" stroke="none"/>
  </g>
  <text x="488" y="433" font-size="14" font-weight="600" fill="#0f172a">Web Frontend</text>
  <text x="488" y="451" font-size="11" fill="#64748b">SSR app shell</text>

  <!-- Auth service -->
  <g filter="url(#sh)">
    <rect x="660" y="400" width="180" height="72" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <rect x="679" y="433" width="16" height="12" rx="2"/>
    <path d="M682,433 v-4 a5,5 0 0 1 10,0 v4"/>
  </g>
  <text x="706" y="433" font-size="14" font-weight="600" fill="#0f172a">Auth Service</text>
  <text x="706" y="451" font-size="11" fill="#64748b">OIDC &#183; sessions</text>

  <!-- Message queue -->
  <g filter="url(#sh)">
    <rect x="895" y="402" width="180" height="68" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.7" fill="none" stroke-linecap="round">
    <line x1="915" y1="428" x2="937" y2="428"/>
    <line x1="919" y1="436" x2="941" y2="436"/>
    <line x1="915" y1="444" x2="937" y2="444"/>
  </g>
  <text x="951" y="431" font-size="13.5" font-weight="600" fill="#0f172a">Message Queue</text>
  <text x="951" y="449" font-size="11" fill="#64748b">jobs &#183; events</text>

  <!-- Worker pool (stacked cards) -->
  <rect x="911" y="536" width="180" height="80" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="903" y="528" width="180" height="80" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <g filter="url(#sh)">
    <rect x="895" y="520" width="180" height="80" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.6" fill="none">
    <rect x="915" y="548" width="9" height="9" rx="1.5"/>
    <rect x="927" y="548" width="9" height="9" rx="1.5"/>
    <rect x="915" y="560" width="9" height="9" rx="1.5"/>
    <rect x="927" y="560" width="9" height="9" rx="1.5"/>
  </g>
  <text x="948" y="556" font-size="13.5" font-weight="600" fill="#0f172a">Worker Pool</text>
  <text x="948" y="574" font-size="11" fill="#64748b">async jobs &#183; &#215;N scaled</text>

  <!-- ================= DATA NODES ================= -->
  <!-- PostgreSQL -->
  <g filter="url(#sh)">
    <rect x="240" y="740" width="240" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  </g>
  <g stroke="#059669" stroke-width="1.6" fill="none">
    <path d="M262,768 a12,5 0 0 1 24,0 v18 a12,5 0 0 1 -24,0 z"/>
    <path d="M262,768 a12,5 0 0 0 24,0"/>
    <path d="M262,777 a12,5 0 0 0 24,0"/>
  </g>
  <text x="300" y="781" font-size="14" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="300" y="799" font-size="11" fill="#64748b">primary relational store</text>

  <!-- Redis -->
  <g filter="url(#sh)">
    <rect x="560" y="740" width="220" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  </g>
  <g stroke="#059669" stroke-width="1.7" fill="none" stroke-linejoin="round">
    <path d="M589,762 l-8,14 h7 l-5,13 14,-16 h-7 l6,-11 z"/>
  </g>
  <text x="610" y="781" font-size="14" font-weight="600" fill="#0f172a">Redis</text>
  <text x="610" y="799" font-size="11" fill="#64748b">cache &#183; sessions &#183; rate limits</text>

  <!-- Object storage -->
  <g filter="url(#sh)">
    <rect x="860" y="740" width="240" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  </g>
  <g stroke="#059669" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <path d="M880,763 h26 l-4,24 h-18 z"/>
    <ellipse cx="893" cy="763" rx="13" ry="3.6"/>
  </g>
  <text x="920" y="781" font-size="14" font-weight="600" fill="#0f172a">Object Storage</text>
  <text x="920" y="799" font-size="11" fill="#64748b">assets &#183; uploads &#183; backups</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="11" fill="#64748b">
    <line x1="180" y1="903" x2="222" y2="903" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="232" y="907">synchronous request / data path</text>
    <line x1="470" y1="903" x2="512" y2="903" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
    <text x="522" y="907">telemetry (metrics &#183; logs &#183; traces)</text>
    <circle cx="790" cy="903" r="3.2" fill="#64748b"/>
    <text x="802" y="907">shared bus junction</text>
  </g>
</svg>
