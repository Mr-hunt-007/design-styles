<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">Northbeam Platform service status board</title>
  <desc id="board-desc">API is operational, the dashboard front-end has an outage, and jobs are degraded. Two incidents are open: INC-4412 elevated error rate on EU ingest, and INC-4415 delayed webhook delivery.</desc>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d3e50"/><stop offset="1" stop-color="#34495e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="#f4f6f8"/>
  <rect x="0" y="0" width="640" height="56" fill="url(#hdr) #2d3e50"/>
  <text x="20" y="36" font-size="20" fill="#ffffff">Northbeam Platform: Service Status</text>

  <g>
    <title>API: operational</title>
    <rect x="24" y="84" width="180" height="70" rx="6" fill="#ffffff" stroke="#d5dbe1" stroke-width="1"/>
    <circle cx="52" cy="119" r="10" fill="#2ecc71" stroke="#1e8449" stroke-width="1.5"/>
    <text x="72" y="115" font-size="13" fill="#2c3e50">API</text>
    <text x="72" y="132" font-size="11" fill="#5a6672">Operational</text>
  </g>
  <g>
    <title>Dashboard web application front-end service: outage</title>
    <rect x="228" y="84" width="180" height="70" rx="6" fill="#ffffff" stroke="#d5dbe1" stroke-width="1"/>
    <circle cx="256" cy="119" r="10" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.5"/>
    <text x="276" y="115" font-size="13" fill="#2c3e50">Dashboard</text>
    <text x="276" y="132" font-size="11" fill="#5a6672">Outage</text>
  </g>
  <g>
    <title>Jobs: degraded</title>
    <rect x="432" y="84" width="180" height="70" rx="6" fill="#ffffff" stroke="#d5dbe1" stroke-width="1"/>
    <circle cx="460" cy="119" r="10" fill="#f1c40f" stroke="#8a6d03" stroke-width="1.5"/>
    <text x="480" y="115" font-size="13" fill="#2c3e50">Jobs</text>
    <text x="480" y="132" font-size="11" fill="#5a6672">Degraded</text>
  </g>

  <g>
    <title>Uptime over the last 30 days</title>
    <rect x="24" y="190" width="280" height="110" rx="6" fill="#ffffff" stroke="#d5dbe1"/>
    <text x="36" y="214" font-size="14" fill="#2c3e50">Uptime, 30 days</text>
    <polyline points="36,280 80,262 124,268 168,244 212,252 256,238 300,246" fill="none" stroke="#3498db" stroke-width="2"/>
  </g>

  <g>
    <title>Open incidents</title>
    <rect x="332" y="190" width="280" height="110" rx="6" fill="#ffffff" stroke="#d5dbe1"/>
    <text x="344" y="214" font-size="14" fill="#2c3e50">Open incidents</text>
    <text x="344" y="240" font-size="12" fill="#4b5563">INC-4412 Elevated error rate on EU ingest</text>
    <text x="344" y="260" font-size="12" fill="#4b5563">INC-4415 Delayed webhook delivery</text>
  </g>

  <g>
    <title>Legend</title>
    <text x="24" y="340" font-size="11" fill="#515e6a">Legend:</text>
    <circle cx="86" cy="336" r="6" fill="#2ecc71" stroke="#1e8449" stroke-width="1.25"/>
    <text x="98" y="340" font-size="11" fill="#515e6a">Operational</text>
    <circle cx="178" cy="336" r="6" fill="#f1c40f" stroke="#8a6d03" stroke-width="1.25"/>
    <text x="190" y="340" font-size="11" fill="#515e6a">Degraded</text>
    <circle cx="262" cy="336" r="6" fill="#e74c3c" stroke="#b03a2e" stroke-width="1.25"/>
    <text x="274" y="340" font-size="11" fill="#515e6a">Outage</text>
  </g>
</svg>
