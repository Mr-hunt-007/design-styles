<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="as-title as-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="as-title">External attack surface diagram</title>
  <desc id="as-desc">Technical diagram showing internet-facing entry points (web application, API gateway, mail) flowing through an edge zone into internal services, with two annotated findings: an exposed admin panel and an unmanaged subdomain.</desc>

  <defs>
    <pattern id="as-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#e3e8ee" stroke-width="1"/>
    </pattern>
    <marker id="as-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#41506b"/>
    </marker>
    <symbol id="as-node" viewBox="0 0 180 64">
      <rect x="1.5" y="1.5" width="177" height="61" rx="8" fill="#ffffff" stroke="#41506b" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="960" height="600" fill="#f7f9fb"/>
  <rect x="0" y="0" width="960" height="600" fill="url(#as-grid)"/>

  <!-- zones (light = annotation weight) -->
  <g>
    <rect x="48" y="96" width="240" height="420" rx="10" fill="#eef2f7" stroke="#b9c4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="372" y="96" width="216" height="420" rx="10" fill="#eef2f7" stroke="#b9c4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="672" y="96" width="240" height="420" rx="10" fill="#eef2f7" stroke="#b9c4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="68" y="126" font-size="13" fill="#5b6a82" letter-spacing="1.5">INTERNET-FACING</text>
    <text x="392" y="126" font-size="13" fill="#5b6a82" letter-spacing="1.5">EDGE</text>
    <text x="692" y="126" font-size="13" fill="#5b6a82" letter-spacing="1.5">INTERNAL</text>
  </g>

  <!-- connectors (medium weight, drawn under nodes) -->
  <g stroke="#41506b" stroke-width="2" fill="none" marker-end="url(#as-arrow)">
    <path d="M268 188 H372 "/>
    <path d="M268 300 H372"/>
    <path d="M268 412 C320 412 320 332 370 316"/>
    <path d="M588 300 H672"/>
  </g>

  <!-- nodes (heavy weight = primary) -->
  <g font-size="14" fill="#1c2a3a">
    <use href="#as-node" x="88" y="156" width="180" height="64"/>
    <text x="178" y="183" text-anchor="middle" font-weight="bold">Web application</text>
    <text x="178" y="203" text-anchor="middle" font-size="12" fill="#5b6a82">app.example.com</text>

    <use href="#as-node" x="88" y="268" width="180" height="64"/>
    <text x="178" y="295" text-anchor="middle" font-weight="bold">API gateway</text>
    <text x="178" y="315" text-anchor="middle" font-size="12" fill="#5b6a82">api.example.com</text>

    <use href="#as-node" x="88" y="380" width="180" height="64"/>
    <text x="178" y="407" text-anchor="middle" font-weight="bold">Mail</text>
    <text x="178" y="427" text-anchor="middle" font-size="12" fill="#5b6a82">MX, SPF, DKIM</text>

    <use href="#as-node" x="390" y="268" width="180" height="64"/>
    <text x="480" y="295" text-anchor="middle" font-weight="bold">WAF / load balancer</text>
    <text x="480" y="315" text-anchor="middle" font-size="12" fill="#5b6a82">edge zone</text>

    <use href="#as-node" x="702" y="268" width="180" height="64"/>
    <text x="792" y="295" text-anchor="middle" font-weight="bold">Internal services</text>
    <text x="792" y="315" text-anchor="middle" font-size="12" fill="#5b6a82">not directly reachable</text>
  </g>

  <!-- findings: colour + shape + label, never colour alone -->
  <g>
    <rect x="384" y="420" width="192" height="56" rx="8" fill="#fdf1f0" stroke="#b03a2e" stroke-width="2"/>
    <path d="M408 452 l8 -14 l8 14 Z" fill="#b03a2e"/>
    <text x="432" y="443" font-size="13" font-weight="bold" fill="#7c2d24">Exposed admin panel</text>
    <text x="432" y="461" font-size="12" fill="#7c2d24">/admin reachable, no MFA</text>

    <rect x="88" y="474" width="196" height="42" rx="8" fill="#fdf6ec" stroke="#9c6f1d" stroke-width="2"/>
    <circle cx="106" cy="495" r="6" fill="none" stroke="#9c6f1d" stroke-width="2"/>
    <text x="120" y="492" font-size="13" font-weight="bold" fill="#6e4f12">Unmanaged subdomain</text>
    <text x="120" y="508" font-size="12" fill="#6e4f12">old.example.com, stale DNS</text>
  </g>

  <!-- annotation callouts with leader lines (light weight) -->
  <g stroke="#9c6f1d" stroke-width="1.5" fill="none">
    <path d="M178 474 V452"/>
    <circle cx="178" cy="448" r="3" fill="#9c6f1d" stroke="none"/>
  </g>
  <g stroke="#b03a2e" stroke-width="1.5" fill="none">
    <path d="M480 420 V340"/>
    <circle cx="480" cy="336" r="3" fill="#b03a2e" stroke="none"/>
  </g>

  <!-- title block, technical-manual convention -->
  <g font-size="12" fill="#5b6a82">
    <line x1="48" y1="552" x2="912" y2="552" stroke="#b9c4d4" stroke-width="1.5"/>
    <text x="48" y="574">FIG. 1 - EXTERNAL ATTACK SURFACE / EXAMPLO LTD</text>
    <text x="912" y="574" text-anchor="end">SOURCE: PASSIVE ENUMERATION / ILLUSTRATIVE DATA</text>
  </g>
</svg>
