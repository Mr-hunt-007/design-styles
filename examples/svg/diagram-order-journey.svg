<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="oj-title oj-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="oj-title">How an online order reaches your door</title>
  <desc id="oj-desc">Technical-style diagram for a general audience showing an online order moving through three stages: order (basket, payment, order record), fulfilment (stock picked, packed and labelled) and delivery (courier collects, local depot, your door), with two annotated customer touchpoints: an out-of-stock email and a tracking link.</desc>

  <defs>
    <pattern id="oj-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#e3e8ee" stroke-width="1"/>
    </pattern>
    <marker id="oj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#41506b"/>
    </marker>
    <symbol id="oj-node" viewBox="0 0 180 64">
      <rect x="1.5" y="1.5" width="177" height="61" rx="8" fill="#ffffff" stroke="#41506b" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="960" height="600" fill="#f7f9fb"/>
  <rect x="0" y="0" width="960" height="600" fill="url(#oj-grid)"/>

  <!-- header -->
  <text x="48" y="44" font-size="20" font-weight="bold" fill="#2a3345">HOW YOUR ORDER REACHES YOUR DOOR</text>
  <text x="48" y="66" font-size="13" fill="#5b6a82">Every step between the Buy button and the doorbell, and when you hear from us.</text>

  <!-- zones (light = annotation weight) -->
  <g>
    <rect x="48" y="96" width="240" height="420" rx="10" fill="#eef2f7" stroke="#b9c4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="372" y="96" width="216" height="420" rx="10" fill="#eef2f7" stroke="#b9c4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="672" y="96" width="240" height="420" rx="10" fill="#eef2f7" stroke="#b9c4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="68" y="126" font-size="13" fill="#5b6a82" letter-spacing="1.5">ORDER</text>
    <text x="392" y="126" font-size="13" fill="#5b6a82" letter-spacing="1.5">FULFILMENT</text>
    <text x="692" y="126" font-size="13" fill="#5b6a82" letter-spacing="1.5">DELIVERY</text>
  </g>

  <!-- flow connectors (drawn under nodes) -->
  <g fill="none" stroke="#41506b" stroke-width="2">
    <path d="M168 224 V272" marker-end="url(#oj-arrow)"/>
    <path d="M168 336 V384" marker-end="url(#oj-arrow)"/>
    <path d="M258 416 H330 Q338 416 338 408 V256 Q338 248 346 248 H386" marker-end="url(#oj-arrow)"/>
    <path d="M480 280 V352" marker-end="url(#oj-arrow)"/>
    <path d="M570 384 H634 Q642 384 642 376 V200 Q642 192 650 192 H698" marker-end="url(#oj-arrow)"/>
    <path d="M792 224 V272" marker-end="url(#oj-arrow)"/>
    <path d="M792 336 V384" marker-end="url(#oj-arrow)"/>
  </g>

  <!-- nodes: order zone -->
  <g>
    <use href="#oj-node" x="78" y="160" width="180" height="64"/>
    <text x="168" y="197" font-size="14" fill="#2a3345" text-anchor="middle">Basket and checkout</text>
    <use href="#oj-node" x="78" y="272" width="180" height="64"/>
    <text x="168" y="309" font-size="14" fill="#2a3345" text-anchor="middle">Payment confirmed</text>
    <use href="#oj-node" x="78" y="384" width="180" height="64"/>
    <text x="168" y="421" font-size="14" fill="#2a3345" text-anchor="middle">Order record created</text>
  </g>

  <!-- nodes: fulfilment zone -->
  <g>
    <use href="#oj-node" x="390" y="216" width="180" height="64"/>
    <text x="480" y="253" font-size="14" fill="#2a3345" text-anchor="middle">Stock picked</text>
    <use href="#oj-node" x="390" y="352" width="180" height="64"/>
    <text x="480" y="389" font-size="14" fill="#2a3345" text-anchor="middle">Packed and labelled</text>
  </g>

  <!-- nodes: delivery zone -->
  <g>
    <use href="#oj-node" x="702" y="160" width="180" height="64"/>
    <text x="792" y="197" font-size="14" fill="#2a3345" text-anchor="middle">Courier collects</text>
    <use href="#oj-node" x="702" y="272" width="180" height="64"/>
    <text x="792" y="309" font-size="14" fill="#2a3345" text-anchor="middle">Local depot</text>
    <use href="#oj-node" x="702" y="384" width="180" height="64"/>
    <text x="792" y="421" font-size="14" fill="#2a3345" text-anchor="middle">Your door</text>
  </g>

  <!-- callout: out-of-stock exception (amber diamond on Stock picked) -->
  <g>
    <rect x="600" y="24" width="330" height="52" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="614" y="45" font-size="12.5" fill="#7c3f0a" font-weight="bold">IF SOMETHING IS OUT OF STOCK</text>
    <text x="614" y="63" font-size="12.5" fill="#7c3f0a">An email within the hour: wait or refund, your choice.</text>
    <path d="M600 60 L568 210" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M568 210 L560 198 L552 210 L560 222 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <!-- callout: tracking link (green circle on Local depot) -->
  <g>
    <rect x="300" y="534" width="330" height="52" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="314" y="555" font-size="12.5" fill="#14532d" font-weight="bold">WHEN THE PARCEL LEAVES THE DEPOT</text>
    <text x="314" y="573" font-size="12.5" fill="#14532d">A tracking link lands by text, live until the doorbell rings.</text>
    <path d="M630 548 L700 342" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="704" cy="336" r="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#5b6a82">
    <rect x="48" y="541" width="18" height="12" rx="3" fill="#ffffff" stroke="#41506b" stroke-width="1.5"/>
    <text x="72" y="551">Process step</text>
    <circle cx="57" cy="572" r="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="72" y="576">You hear from us</text>
    <path d="M174 572 L181 563 L188 572 L181 581 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="196" y="576">Exception handled</text>
  </g>

  <!-- title block -->
  <g>
    <rect x="672" y="534" width="240" height="52" fill="#ffffff" stroke="#41506b" stroke-width="1.5"/>
    <text x="684" y="555" font-size="12" font-weight="bold" fill="#2a3345">EXAMPLO LTD · ORDER JOURNEY</text>
    <text x="684" y="573" font-size="11" fill="#5b6a82">DWG EJ-01 · SHEET 1 OF 1 · REV A</text>
  </g>
</svg>
